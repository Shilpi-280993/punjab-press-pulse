<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punjab Press Pulse</title>
<meta name="description" content="Daily sentiment, themes and newspaper-by-newspaper coverage of AAP and the Punjab government in Punjab newspapers, with a date switcher and day-over-day trends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --font-anthropic-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-anthropic-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --color-bg:#f6f5f2; --color-panel:#ffffff; --color-fg:#1d1f24; --color-fg-muted:#636873; --color-border-line:#e2e0da;
  --color-ok:#1f7a4d; --color-warn:#b7791f; --color-bad:#b8372d;
  --cds-chart-muted:#9aa0a8; --cds-chart-grid:#ecebe6; --cds-surface-popover:#ffffff; --cds-border:#d9d6cf;
  --cds-shadow-popover:0 6px 24px rgba(20,20,30,.12); --cds-text-secondary:#636873;
  --cds-radius:10px; --cds-pad-xs:4px; --cds-pad-sm:8px; --cds-pad-md:12px; --cds-pad-lg:18px; --cds-pad-xl:28px;
  --cds-gap-xs:4px; --cds-gap-sm:8px; --cds-gap-md:16px; --cds-gap-lg:24px; --cds-gap-xl:40px;
  --cds-font-size-caption:12.5px; --cds-font-size-body:14.5px; --cds-font-size-heading:16px; --cds-font-size-title:26px;
  --cds-font-weight-medium:600; --cds-dur-slow:.45s; --cds-ease-out:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --color-bg:#121418; --color-panel:#1a1d23; --color-fg:#e8e9ec; --color-fg-muted:#9aa1ab; --color-border-line:#2b3038;
  --color-ok:#4cc38a; --color-warn:#e0a54a; --color-bad:#ef766b;
  --cds-chart-muted:#6b727c; --cds-chart-grid:#262a31; --cds-surface-popover:#22262d; --cds-border:#353b44;
  --cds-shadow-popover:0 6px 24px rgba(0,0,0,.45); --cds-text-secondary:#9aa1ab; color-scheme:dark}}
html,body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans);font-size:var(--cds-font-size-body);line-height:1.5}
#dash-root{padding:32px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:900px){#dash-root{padding-inline:40px}}
.dash-skeleton{color:transparent!important;background:var(--cds-chart-grid);border-radius:6px}
.pp-foot{max-width:1200px;margin:40px auto 0;color:var(--color-fg-muted);font-size:12.5px}
</style>
<script>
// Minimal stand-in for the dashboard runtime: one embedded dataset, calcs and onData.
// 'stories' is filtered to the selected date ('all' = every date); 'all_stories' is unfiltered.
window.dash = (function () {
  const sets = {}, calcs = {}, subs = [];
  let cache = {}, date = 'all';
  return {
    colors: ['#3b6fd8', '#e0782b', '#8a5cc7', '#2f9c95', '#d04f7a', '#7a8b2f', '#c0912b', '#5a6b80'],
    _set(id, rows) { sets[id] = rows; },
    calc(id, o) { calcs[id] = o; },
    dates() { return [...new Set((sets.stories || []).map((r) => r.date))].sort(); },
    date() { return date; },
    setDate(d) { date = d; cache = {}; this._fire(); },
    data(id) {
      if (id === 'all_stories') return { status: 'ok', data: sets.stories || [], meta: [] };
      if (sets[id]) {
        const rows = date === 'all' ? sets[id] : sets[id].filter((r) => r.date === date);
        return { status: 'ok', data: rows, columns: Object.keys(rows[0] || {}), meta: [] };
      }
      if (calcs[id]) {
        if (!cache[id]) cache[id] = calcs[id].fn(...calcs[id].inputs.map((i) => this.data(i).data));
        return { status: 'ok', data: cache[id], columns: Object.keys(cache[id][0] || {}), meta: [] };
      }
      return { status: 'missing', data: [] };
    },
    onData(fn) { subs.push(fn); if (document.readyState !== 'loading') fn(); },
    _fire() { subs.forEach((f) => f()); },
    params() { return {}; }, setParams() {}, resetParams() {}, setLink() {}, refresh() {},
  };
})();
</script>
</head>
<body>
<div id="dash-root">
